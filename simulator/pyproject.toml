[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rm27-referee-simulator"
version = "0.1.0"
description = "Independent upstream RM26 simulator port for RM27 client development"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "fastapi",
    "uvicorn",
    "python-socketio",
    "python-multipart",
    "opencv-python",
    "numpy",
    "paho-mqtt",
    "protobuf>=6.33.2,<7",
]

[project.optional-dependencies]
test = ["amqtt>=0.11,<0.12", "requests", "websocket-client"]

[tool.setuptools]
packages = [
    "simulator", "simulator.server", "simulator.protocol",
    "simulator.tools", "simulator.tools.release", "simulator.tools.release.tests",
    "simulator.scripts",
]
package-dir = {simulator = "."}

[tool.setuptools.package-data]
simulator = [
    "LICENSE", "*.md", "*.json",
    "protocol/*.proto", "server/config.json", "server/static/*", "server/static/vendor/*",
    "scripts/*.ps1", "scripts/*.py", "scripts/*.md", "docker/*.conf", "docker/*.yml",
    "resources/videos/README.md", "licenses/*",
]
